<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16101c">
  <title>Happy Birthday, Hannah!</title>
  <meta name="description" content="A little birthday surprise for Hannah 🎂">

  <!-- Link preview (WhatsApp, iMessage, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Happy Birthday, Hannah! 🎂">
  <meta property="og:description" content="Swipe and pick one 🎁">
  <meta property="og:url" content="https://maeddes.github.io/hannah-birthday/">
  <meta property="og:image" content="https://maeddes.github.io/hannah-birthday/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { --bg: #16101c; --fg: #fff; --accent: #e0245e; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 0%, #3a1d4a, var(--bg) 70%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* Swipe container: each slide is one full screen */
    .slides {
      display: flex;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }
    .slides::-webkit-scrollbar { display: none; }

    .slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.5rem 1.25rem calc(7rem + env(safe-area-inset-bottom));
      text-align: center;
    }

    h1 { margin: 0; font-size: clamp(2.2rem, 11vw, 4.5rem); line-height: 1.1; }
    .title { font-size: clamp(3rem, 17vw, 6rem); line-height: 1.05; animation: pop 3s ease-in-out infinite; }
    .shine {
      background: linear-gradient(90deg, #fff, #ffd166, #ff5fa2, #7bdff2, #fff);
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: shimmer 4s linear infinite;
      filter: drop-shadow(0 0 12px rgba(255, 150, 200, .5));
    }
    .title { text-shadow: 0 0 25px rgba(255, 255, 255, .35); }
    .first { position: relative; }
    .swipe {
      position: absolute; left: 0; right: 0;
      bottom: calc(6.5rem + env(safe-area-inset-bottom));
      margin: 0; opacity: .75; font-size: 1.1rem;
      animation: nudge 1.6s ease-in-out infinite;
    }
    @keyframes shimmer { to { background-position: -300% 0; } }
    @keyframes pop { 50% { transform: scale(1.04) rotate(-1deg); } }
    @keyframes nudge { 50% { transform: translateX(10px); } }
    #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .slides, nav { position: relative; z-index: 1; }
    nav { position: fixed; }
    @media (prefers-reduced-motion: reduce) {
      .title, .shine, .swipe { animation: none; }
    }

    .card {
      background: #fff;
      border-radius: 1.25rem;
      padding: .75rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
      max-width: 100%;
    }
    .card img {
      display: block;
      max-width: 100%;
      max-height: 62dvh;
      width: auto;
      height: auto;
      border-radius: .75rem;
    }
    .logo { background: transparent; box-shadow: none; padding: 0; }
    .logo img { max-height: 45dvh; border-radius: 50%; }

    /* Bottom navigation */
    nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem calc(1rem + env(safe-area-inset-bottom));
    }
    nav button {
      width: 3.5rem; height: 3.5rem;
      border: 0; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 1.75rem; line-height: 1;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    nav button:active { transform: scale(.92); }
    nav button[disabled] { opacity: .0; pointer-events: none; }

    .dots { display: flex; gap: .55rem; }
    .dots i {
      width: .6rem; height: .6rem; border-radius: 50%;
      background: rgba(255, 255, 255, .3);
      transition: background .2s, transform .2s;
    }
    .dots i.on { background: #fff; transform: scale(1.3); }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <main class="slides" id="slides">
    <section class="slide first">
      <h1 class="title">Happy<br>Birthday,<br><span class="shine">Hannah!</span></h1>
      <p class="swipe">Swipe <b>→</b></p>
    </section>

    <section class="slide">
      <h1 class="shine">Pick one</h1>
    </section>

    <section class="slide">
      <div class="card"><img src="img/slipknot.jpg" alt="Slipknot – All Hope Is Gone shirt"></div>
    </section>
    <section class="slide">
      <div class="card"><img src="img/type-o-negative.jpg" alt="Type O Negative shirt"></div>
    </section>
    <section class="slide">
      <div class="card"><img src="img/soad.jpg" alt="System of a Down – SOAD XX shirt"></div>
    </section>
    <section class="slide">
      <div class="card"><img src="img/korn.jpg" alt="Korn shirt"></div>
    </section>

    <section class="slide">
      <h1>or something else you like</h1>
      <div class="card logo"><img src="img/emp-logo.png" alt="EMP logo"></div>
    </section>
  </main>

  <nav>
    <button id="prev" aria-label="Back">←</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button id="next" aria-label="Next">→</button>
  </nav>

  <script>
    const slides = document.getElementById('slides');
    const pages = slides.children.length;
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const dots = document.getElementById('dots');

    for (let i = 0; i < pages; i++) dots.appendChild(document.createElement('i'));

    const current = () => Math.round(slides.scrollLeft / slides.clientWidth);
    const go = i => slides.scrollTo({ left: Math.max(0, Math.min(pages - 1, i)) * slides.clientWidth });

    function update() {
      const c = current();
      [...dots.children].forEach((d, i) => d.classList.toggle('on', i === c));
      prev.disabled = c === 0;
      next.disabled = c === pages - 1;
    }

    prev.onclick = () => go(current() - 1);
    next.onclick = () => go(current() + 1);
    slides.addEventListener('scroll', update, { passive: true });
    addEventListener('resize', () => { slides.style.scrollBehavior = 'auto'; go(current()); slides.style.scrollBehavior = ''; update(); });
    addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') go(current() + 1);
      if (e.key === 'ArrowLeft') go(current() - 1);
    });
    update();

    // Confetti + twinkling sparkles
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
      const colors = ['#ff5fa2', '#ffd166', '#7bdff2', '#b388ff', '#ffffff', '#ff8a5c'];
      let W, H, dpr;
      const fit = () => { dpr = devicePixelRatio || 1; W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; };
      fit(); addEventListener('resize', fit);
      const rnd = (a, b) => a + Math.random() * (b - a);
      const conf = [], stars = [];
      const piece = (x, y, burst) => ({
        x, y, w: rnd(6, 11) * dpr, h: rnd(10, 18) * dpr, c: colors[Math.random() * colors.length | 0],
        vx: burst ? rnd(-6, 6) * dpr : rnd(-.6, .6) * dpr, vy: burst ? rnd(-12, -3) * dpr : rnd(1, 2.5) * dpr,
        r: rnd(0, 6.3), vr: rnd(-.15, .15)
      });
      for (let i = 0; i < 45; i++) conf.push(piece(rnd(0, W), rnd(-H, H), false));
      for (let i = 0; i < 28; i++) stars.push({ x: rnd(0, W), y: rnd(0, H), s: rnd(5, 14) * dpr, p: rnd(0, 6.3), v: rnd(.02, .06) });
      const burst = (x, y) => { for (let i = 0; i < 50; i++) conf.push(piece(x * dpr, y * dpr, true)); };
      burst(innerWidth / 2, innerHeight / 2);
      addEventListener('pointerdown', e => burst(e.clientX, e.clientY));

      const star = (x, y, s) => {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? s * .2 : s; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
        ctx.closePath(); ctx.fill();
      };
      (function frame() {
        ctx.clearRect(0, 0, W, H);
        for (const t of stars) {
          t.p += t.v; ctx.globalAlpha = Math.max(0, Math.sin(t.p)) * .9; ctx.fillStyle = '#fff'; star(t.x, t.y, t.s);
        }
        ctx.globalAlpha = 1;
        for (let i = conf.length - 1; i >= 0; i--) {
          const c = conf[i];
          c.x += c.vx; c.y += c.vy; c.r += c.vr;
          if (c.vy < 2.5 * dpr) c.vy += .25 * dpr; // gravity settles into slow fall
          c.vx *= .99;
          if (c.y > H + 30) { if (i >= 45 || conf.length > 45 + 200) { conf.splice(i, 1); continue; } c.y = -20; c.x = rnd(0, W); c.vy = rnd(1, 2.5) * dpr; }
          ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore();
        }
        requestAnimationFrame(frame);
      })();
    }
  </script>
</body>
</html>
