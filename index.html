<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16101c">
  <title>Happy Birthday, Hannah!</title>
  <style>
    :root { --bg: #16101c; --fg: #fff; --accent: #e0245e; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 0%, #3a1d4a, var(--bg) 70%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* Swipe container: each slide is one full screen */
    .slides {
      display: flex;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }
    .slides::-webkit-scrollbar { display: none; }

    .slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.5rem 1.25rem calc(7rem + env(safe-area-inset-bottom));
      text-align: center;
    }

    h1 { margin: 0; font-size: clamp(2.2rem, 11vw, 4.5rem); line-height: 1.1; }
    .hb { font-size: 1.2rem; opacity: .8; margin: 0; }
    .hint { opacity: .6; font-size: 1rem; margin: 0; }

    .card {
      background: #fff;
      border-radius: 1.25rem;
      padding: .75rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
      max-width: 100%;
    }
    .card img {
      display: block;
      max-width: 100%;
      max-height: 62dvh;
      width: auto;
      height: auto;
      border-radius: .75rem;
    }
    .logo { background: transparent; box-shadow: none; padding: 0; }
    .logo img { max-height: 45dvh; border-radius: 50%; }

    /* Bottom navigation */
    nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem calc(1rem + env(safe-area-inset-bottom));
    }
    nav button {
      width: 3.5rem; height: 3.5rem;
      border: 0; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 1.75rem; line-height: 1;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    nav button:active { transform: scale(.92); }
    nav button[disabled] { opacity: .0; pointer-events: none; }

    .dots { display: flex; gap: .55rem; }
    .dots i {
      width: .6rem; height: .6rem; border-radius: 50%;
      background: rgba(255, 255, 255, .3);
      transition: background .2s, transform .2s;
    }
    .dots i.on { background: #fff; transform: scale(1.3); }
  </style>
</head>
<body>
  <main class="slides" id="slides">
    <section class="slide">
      <p class="hb">Happy Birthday, Hannah! 🎂</p>
      <h1>Pick one</h1>
      <p class="hint">Swipe or tap the arrow →</p>
    </section>

    <section class="slide">
      <div class="card"><img src="img/slipknot.jpg" alt="Slipknot – All Hope Is Gone shirt"></div>
    </section>
    <section class="slide">
      <div class="card"><img src="img/type-o-negative.jpg" alt="Type O Negative shirt"></div>
    </section>
    <section class="slide">
      <div class="card"><img src="img/soad.jpg" alt="System of a Down – SOAD XX shirt"></div>
    </section>
    <section class="slide">
      <div class="card"><img src="img/korn.jpg" alt="Korn shirt"></div>
    </section>

    <section class="slide">
      <h1>or something else you like</h1>
      <div class="card logo"><img src="img/emp-logo.png" alt="EMP logo"></div>
    </section>
  </main>

  <nav>
    <button id="prev" aria-label="Back">←</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button id="next" aria-label="Next">→</button>
  </nav>

  <script>
    const slides = document.getElementById('slides');
    const pages = slides.children.length;
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const dots = document.getElementById('dots');

    for (let i = 0; i < pages; i++) dots.appendChild(document.createElement('i'));

    const current = () => Math.round(slides.scrollLeft / slides.clientWidth);
    const go = i => slides.scrollTo({ left: Math.max(0, Math.min(pages - 1, i)) * slides.clientWidth });

    function update() {
      const c = current();
      [...dots.children].forEach((d, i) => d.classList.toggle('on', i === c));
      prev.disabled = c === 0;
      next.disabled = c === pages - 1;
    }

    prev.onclick = () => go(current() - 1);
    next.onclick = () => go(current() + 1);
    slides.addEventListener('scroll', update, { passive: true });
    addEventListener('resize', () => { slides.style.scrollBehavior = 'auto'; go(current()); slides.style.scrollBehavior = ''; update(); });
    addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') go(current() + 1);
      if (e.key === 'ArrowLeft') go(current() - 1);
    });
    update();
  </script>
</body>
</html>
